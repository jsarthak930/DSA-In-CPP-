<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1320" viewBox="0 0 1000 1320">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#334155"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172554; }
      .title { font-size: 32px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 600; }
      .small { font-size: 17px; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .node { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .terminal { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .error { fill: #fee2e2; stroke: #dc2626; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1000" height="1320" fill="#ffffff"/>
  <text x="500" y="55" text-anchor="middle" class="title">Prim’s Algorithm — Mining Network Flowchart</text>

  <rect x="330" y="85" width="340" height="70" rx="35" class="terminal"/>
  <text x="500" y="128" text-anchor="middle" class="label">Start</text>
  <path d="M500 155 V190" class="edge"/>

  <rect x="220" y="195" width="560" height="105" rx="12" class="node"/>
  <text x="500" y="237" text-anchor="middle" class="label">Build weighted graph</text>
  <text x="500" y="270" text-anchor="middle" class="small">Sites = vertices; candidate links and costs = edges</text>
  <path d="M500 300 V335" class="edge"/>

  <rect x="250" y="340" width="500" height="90" rx="12" class="node"/>
  <text x="500" y="378" text-anchor="middle" class="label">Choose starting site</text>
  <text x="500" y="408" text-anchor="middle" class="small">Add it to network; queue its outgoing edges</text>
  <path d="M500 430 V465" class="edge"/>

  <polygon points="500,470 690,545 500,620 310,545" class="decision"/>
  <text x="500" y="538" text-anchor="middle" class="label">All sites connected?</text>
  <text x="500" y="568" text-anchor="middle" class="small">(selected edges = sites − 1)</text>

  <path d="M690 545 H820 V670" class="edge"/>
  <text x="738" y="530" class="small">Yes</text>
  <rect x="690" y="675" width="270" height="100" rx="12" class="terminal"/>
  <text x="825" y="715" text-anchor="middle" class="label">Display selected</text>
  <text x="825" y="746" text-anchor="middle" class="small">edges and total cost</text>
  <path d="M825 775 V820" class="edge"/>
  <rect x="725" y="825" width="200" height="65" rx="32" class="terminal"/>
  <text x="825" y="866" text-anchor="middle" class="label">End</text>

  <path d="M500 620 V655" class="edge"/>
  <text x="515" y="646" class="small">No</text>
  <polygon points="500,660 690,735 500,810 310,735" class="decision"/>
  <text x="500" y="728" text-anchor="middle" class="label">Any candidate edge</text>
  <text x="500" y="758" text-anchor="middle" class="small">left in priority queue?</text>

  <path d="M690 735 H820 V930 H650" class="edge"/>
  <text x="738" y="720" class="small">No</text>
  <rect x="350" y="895" width="300" height="95" rx="12" class="error"/>
  <text x="500" y="933" text-anchor="middle" class="label">Report disconnected</text>
  <text x="500" y="964" text-anchor="middle" class="small">network; stop</text>
  <path d="M500 990 V1030" class="edge"/>
  <rect x="400" y="1035" width="200" height="65" rx="32" class="terminal"/>
  <text x="500" y="1076" text-anchor="middle" class="label">End</text>

  <path d="M310 735 H185 V1140 H360" class="edge"/>
  <text x="205" y="720" class="small">Yes</text>
  <rect x="360" y="1110" width="280" height="105" rx="12" class="node"/>
  <text x="500" y="1150" text-anchor="middle" class="label">Take cheapest edge</text>
  <text x="500" y="1181" text-anchor="middle" class="small">to a site outside network</text>
  <path d="M640 1162 H900 V545 H695" class="edge"/>
  <text x="830" y="1137" class="small">Add site, record edge,</text>
  <text x="830" y="1158" class="small">update total and queue;</text>
  <text x="830" y="1179" class="small">repeat</text>
</svg>
